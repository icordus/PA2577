name: PA2577 CI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pa2577-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    if: >-
      github.repository == 'icordus/PA2577' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_VERSION: ${{ github.ref_name }}
      TASKS_BUILD_IMAGE: pa2577-ci-${{ github.run_id }}-${{ github.run_attempt }}-tasks:${{ github.sha }}
      STATISTICS_BUILD_IMAGE: pa2577-ci-${{ github.run_id }}-${{ github.run_attempt }}-statistics:${{ github.sha }}
      POSTGRES_IMAGE: docker.io/library/postgres:17-bookworm

    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check prerequisites and allocate an integration ID
        run: bash scripts/ci_init.sh

      - name: Run offline isolation safety tests
        run: python3 -m unittest discover -s tests -p test_integration_safety.py -v

      - name: Build ARM64 images once and record their identities
        run: bash scripts/ci_build.sh

      - name: Fetch PostgreSQL and test the exact built images over isolated HTTP
        run: bash scripts/ci_test.sh

      - name: Log in to Docker Hub only after tests pass
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/ci_login.sh

      - name: Publish tested image IDs with fixed version and full SHA tags
        run: bash scripts/ci_publish.sh

      - name: Clean only this job's temporary resources, even on failure
        if: ${{ always() }}
        run: python3 scripts/ci_cleanup.py

      - name: Report tested commit
        if: ${{ success() }}
        run: bash scripts/ci_report.sh

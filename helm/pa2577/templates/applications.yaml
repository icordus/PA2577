{{- range $component := list "tasks" "statistics" }}
{{- $service := index $.Values $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: {{ $service.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $service.repository $.Values.imageTag | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- if eq $component "tasks" }}
            - name: DB_HOST
              value: {{ printf "%s-postgres" $.Release.Name | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: pa2577
            - name: DB_USER
              value: pa2577_tasks
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgresql.existingSecret }}
                  key: {{ $.Values.postgresql.tasksPasswordKey }}
            - name: STATISTICS_API_URL
              value: {{ printf "http://%s-statistics:8000" $.Release.Name | quote }}
            - name: STATISTICS_TIMEOUT_SECONDS
              value: "3"
            {{- else }}
            - name: TASKS_API_URL
              value: {{ printf "http://%s-tasks:8000" $.Release.Name | quote }}
            - name: TASKS_TIMEOUT_SECONDS
              value: "3"
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: {{ if eq $component "tasks" }}/ready{{ else }}/health{{ end }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  namespace: {{ $.Values.namespace }}
spec:
  type: {{ if eq $component "tasks" }}NodePort{{ else }}ClusterIP{{ end }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      {{- if eq $component "tasks" }}
      nodePort: {{ $service.service.nodePort }}
      {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  namespace: {{ .Values.namespace }}
data:
  10-tasks.sh: |
    #!/bin/sh
    set -eu
    export PGPASSWORD="$POSTGRES_PASSWORD"
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set=ON_ERROR_STOP=1 <<'SQL'
    \getenv tasks_password TASKS_DB_PASSWORD
    BEGIN;
    CREATE ROLE pa2577_tasks LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 20 PASSWORD :'tasks_password';
    REVOKE CREATE, TEMPORARY ON DATABASE pa2577 FROM PUBLIC;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    GRANT CONNECT ON DATABASE pa2577 TO pa2577_tasks;
    CREATE SCHEMA tasks AUTHORIZATION postgres;
    REVOKE ALL ON SCHEMA tasks FROM PUBLIC;
    CREATE TABLE tasks.tasks (
      id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
      title varchar(200) NOT NULL CHECK (char_length(btrim(title)) > 0),
      completed boolean NOT NULL DEFAULT false,
      created_at timestamptz NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    GRANT USAGE ON SCHEMA tasks TO pa2577_tasks;
    GRANT SELECT, DELETE ON tasks.tasks TO pa2577_tasks;
    GRANT INSERT (title, completed), UPDATE (title, completed) ON tasks.tasks TO pa2577_tasks;
    GRANT USAGE ON SEQUENCE tasks.tasks_id_seq TO pa2577_tasks;
    COMMIT;
    SQL
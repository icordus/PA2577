namespace: pa2577

# Fixed release tag. CI also publishes the immutable full commit SHA tag.
imageTag: "v0.1.0"
imagePullSecrets: []

tasks:
  repository: docker.io/icordus/pa2577-tasks
  replicaCount: 1
  service:
    nodePort: 30081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

statistics:
  repository: docker.io/icordus/pa2577-statistics
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 192Mi

postgresql:
  image: docker.io/library/postgres:17-bookworm
  # Create this Secret separately in pa2577 after approval; do not put passwords here.
  existingSecret: pa2577-database
  adminPasswordKey: postgres-password
  tasksPasswordKey: tasks-password
  persistence:
    size: 2Gi
    # No provisioner is installed. An approved, dedicated local PV must exist first.
    storageClassName: ""
    volumeName: pa2577-postgres-pv
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi